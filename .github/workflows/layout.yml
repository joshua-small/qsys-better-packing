name: Packing contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/PackingLayout.Tests.csproj
      - run: dotnet run --project tests/PinPacking/PinPacking.Tests.csproj
      - run: dotnet run --project tests/Transpose/Transpose.Tests.csproj -c Release
  routing:
    name: Windows routing
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: qsys-better-packing
      - uses: actions/checkout@v7
        with:
          repository: joshua-small/qsys-mods-core
          # Released Core 0.1.10, matching the transpose package dependency.
          ref: b046960b250fe41285b4612913cf32dfb532b16c
          path: qsys-mods-core
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: qsys-better-packing/global.json
      - run: dotnet run --project tests/PackingCommands/PackingCommands.Tests.csproj -c Release
        working-directory: qsys-better-packing
      - run: dotnet run --project tests/TransposeCommands/TransposeCommands.Tests.csproj -c Release
        working-directory: qsys-better-packing
